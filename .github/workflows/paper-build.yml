name: Paper Build

on:
  pull_request:
    branches: [main]
    paths: ["paper/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Compile paper
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tectonic
        run: |
          curl -sSfL -o tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-aarch64-unknown-linux-musl.tar.gz
          tar -xzf tectonic.tar.gz
          chmod +x tectonic
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Compile paper.tex
        working-directory: paper
        run: tectonic paper.tex
