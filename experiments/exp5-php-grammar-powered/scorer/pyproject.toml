[project]
name = "exp5-php-scorer"
version = "0.1.0"
description = "Offline deterministic scorer for Exp5 PHP grammar sessions"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-php==0.25.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
